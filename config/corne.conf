# Bật BLE split
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_NONE=y

# Power management
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y

# Năng lượng (giữ kết nối tốt khi cắm nguồn USB)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
